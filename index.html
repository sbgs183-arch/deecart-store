<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deecart — Shop Smart</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f6f6f6;color:#111}

header{
position:sticky;top:0;z-index:20;background:#111;color:#fff;
padding:14px 5%;display:flex;align-items:center;gap:18px;flex-wrap:wrap
}

.logo{font-size:25px;font-weight:800;letter-spacing:1px}

.search{
flex:1;min-width:180px;max-width:520px;padding:12px 16px;
border:0;border-radius:24px;outline:0
}

nav{display:flex;gap:8px;align-items:center}
nav button{
background:transparent;color:#fff;border:0;padding:8px;
cursor:pointer;font-size:14px
}

.badge{
background:#fff;color:#111;border-radius:20px;
padding:2px 7px;font-size:11px
}

.hero{
padding:70px 5%;text-align:center;
background:linear-gradient(135deg,#111,#454545);color:#fff
}

.hero h1{font-size:42px;margin-bottom:12px}
.hero p{font-size:17px;margin-bottom:22px}

.btn{
border:0;background:#fff;color:#111;padding:12px 24px;
border-radius:24px;font-weight:700;cursor:pointer
}

.section{padding:38px 5%}
.section h2{text-align:center;margin-bottom:22px}

.categories{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
gap:12px
}

.category{
background:#fff;border:1px solid #eee;padding:20px;
text-align:center;border-radius:12px;cursor:pointer;font-weight:700
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:18px
}

.product{
background:#fff;border-radius:14px;overflow:hidden;
box-shadow:0 2px 10px #ddd;position:relative
}

.product img{
width:100%;height:210px;object-fit:cover
}

.product-info{padding:14px}
.product h3{margin-bottom:6px}
.muted{color:#666;font-size:13px}

.price{
font-size:19px;font-weight:800;margin:10px 0
}

.actions{display:flex;gap:8px}

.cart-btn{
flex:1;border:0;padding:10px;background:#111;
color:#fff;border-radius:8px;cursor:pointer
}

.wish{
border:1px solid #ddd;background:#fff;
border-radius:8px;padding:0 11px;
cursor:pointer;font-size:18px
}

.empty{text-align:center;padding:35px;color:#666}

footer{
background:#111;color:#fff;text-align:center;
padding:30px;margin-top:35px
}

.modal{
display:none;position:fixed;inset:0;
background:rgba(0,0,0,.55);z-index:50
}

.panel{
background:#fff;max-width:620px;margin:6vh auto;
padding:22px;border-radius:16px;
max-height:88vh;overflow:auto
}

.close{
float:right;border:0;background:#eee;
border-radius:50%;width:32px;height:32px;cursor:pointer
}

.row{
display:flex;gap:12px;align-items:center;
padding:12px 0;border-bottom:1px solid #eee
}

.row img{
width:65px;height:65px;object-fit:cover;border-radius:8px
}

.qty button{
padding:3px 8px;border:1px solid #ccc;background:#fff
}

.total{
font-size:20px;font-weight:800;
text-align:right;margin:18px 0
}

.checkout{
width:100%;padding:13px;border:0;border-radius:9px;
background:#111;color:#fff;font-weight:700
}

@media(max-width:600px){
.hero h1{font-size:32px}
header{justify-content:center}
nav{width:100%;justify-content:center}
}
</style>
</head>

<body>

<header>

<div class="logo">DEECART</div>

<input id="search"
class="search"
type="search"
placeholder="Search products...">

<nav>

<button onclick="scrollToShop()">Shop</button>

<button onclick="openWishlist()">
❤️ <span id="wishCount" class="badge">0</span>
</button>

<button onclick="openCart()">
🛒 <span id="cartCount" class="badge">0</span>
</button>

<button onclick="alert('Login/OTP will be connected in the next step.')">
👤
</button>

</nav>

</header>


<section class="hero">

<h1>Shop Everything. One Cart.</h1>

<p>Discover products you'll love at great prices.</p>

<button class="btn" onclick="scrollToShop()">
Shop Now
</button>

</section>


<section class="section">

<h2>Categories</h2>

<div class="categories">

<div class="category"
onclick="filterCategory('Fashion')">
👕 Fashion
</div>

<div class="category"
onclick="filterCategory('Electronics')">
📱 Electronics
</div>

<div class="category"
onclick="filterCategory('Beauty')">
💄 Beauty
</div>

<div class="category"
onclick="filterCategory('Home')">
🏠 Home & Living
</div>

<div class="category"
onclick="filterCategory('Accessories')">
⌚ Accessories
</div>

</div>

</section>


<section class="section" id="shop">

<h2>Featured Products</h2>

<div id="products" class="products"></div>

</section>


<footer>

<h2>DEECART</h2>

<p>Shop Smart. Live Better.</p>

<p style="margin-top:10px">
© 2026 Deecart
</p>

</footer>


<div id="cartModal"
class="modal"
onclick="closeOnBackdrop(event,'cartModal')">

<div class="panel">

<button class="close"
onclick="closeModal('cartModal')">
✕
</button>

<h2>Your Cart</h2>

<div id="cartItems"></div>

<div id="cartTotal" class="total"></div>

<button class="checkout"
onclick="alert('Checkout/payment will be connected after database setup.')">

Proceed to Checkout

</button>

</div>

</div>


<div id="wishModal"
class="modal"
onclick="closeOnBackdrop(event,'wishModal')">

<div class="panel">

<button class="close"
onclick="closeModal('wishModal')">
✕
</button>

<h2>Wishlist</h2>

<div id="wishItems"></div>

</div>

</div>


<script>

const products=[

{
id:1,
name:'Classic T-Shirt',
category:'Fashion',
price:499,
img:'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80'
},

{
id:2,
name:'Wireless Headphones',
category:'Electronics',
price:1999,
img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80'
},

{
id:3,
name:'Classic Watch',
category:'Accessories',
price:999,
img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80'
},

{
id:4,
name:'Running Shoes',
category:'Fashion',
price:1499,
img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80'
},

{
id:5,
name:'Skincare Set',
category:'Beauty',
price:799,
img:'https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=600&q=80'
},

{
id:6,
name:'Modern Lamp',
category:'Home',
price:1299,
img:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=600&q=80'
}

];


let cart=
JSON.parse(localStorage.getItem('deecart_cart')||'[]');

let wishlist=
JSON.parse(localStorage.getItem('deecart_wishlist')||'[]');


function money(n){

return '₹'+n.toLocaleString('en-IN');

}


function render(list=products){

const box=document.getElementById('products');

box.innerHTML=list.length?

list.map(p=>`

<article class="product">

<img src="${p.img}" alt="${p.name}">

<div class="product-info">

<h3>${p.name}</h3>

<div class="muted">
${p.category}
</div>

<div class="price">
${money(p.price)}
</div>

<div class="actions">

<button
class="cart-btn"
onclick="addCart(${p.id})">

Add to Cart

</button>

<button
class="wish"
onclick="toggleWish(${p.id})">

${wishlist.includes(p.id)?'♥':'♡'}

</button>

</div>

</div>

</article>

`).join('')

:

'<div class="empty">No products found.</div>';

updateCounts();

}


function addCart(id){

let x=cart.find(i=>i.id===id);

x?x.qty++:cart.push({
id:id,
qty:1
});

save();

render();

alert('Added to cart!');

}


function toggleWish(id){

wishlist.includes(id)

?wishlist=wishlist.filter(x=>x!==id)

:wishlist.push(id);

save();

render();

}


function save(){

localStorage.setItem(
'deecart_cart',
JSON.stringify(cart)
);

localStorage.setItem(
'deecart_wishlist',
JSON.stringify(wishlist)
);

updateCounts();

}


function updateCounts(){

document.getElementById('cartCount').textContent=
cart.reduce((s,x)=>s+x.qty,0);

document.getElementById('wishCount').textContent=
wishlist.length;

}


function openCart(){

document.getElementById('cartModal')
.style.display='block';

renderCart();

}


function openWishlist(){

document.getElementById('wishModal')
.style.display='block';

renderWish();

}


function closeModal(id){

document.getElementById(id)
.style.display='none';

}


function closeOnBackdrop(e,id){

if(e.target.id===id)
closeModal(id);

}


function renderCart(){

const box=document.getElementById('cartItems');

if(!cart.length){

box.innerHTML=
'<div class="empty">Your cart is empty.</div>';

document.getElementById('cartTotal')
.textContent='';

return;

}

let total=0;

box.innerHTML=

cart.map(i=>{

let p=products.find(x=>x.id===i.id);

total+=p.price*i.qty;

return `

<div class="row">

<img src="${p.img}">

<div style="flex:1">

<b>${p.name}</b>

<div>
${money(p.price)}
</div>

<div class="qty">

<button
onclick="changeQty(${p.id},-1)">
−
</button>

${i.qty}

<button
onclick="changeQty(${p.id},1)">
+
</button>

</div>

</div>

<button
onclick="removeCart(${p.id})">
✕
</button>

</div>

`;

}).join('');

document.getElementById('cartTotal')
.textContent='Total: '+money(total);

}


function changeQty(id,d){

let x=cart.find(i=>i.id===id);

x.qty+=d;

if(x.qty<=0)
cart=cart.filter(i=>i.id!==id);

save();

renderCart();

render();

}


function removeCart(id){

cart=cart.filter(i=>i.id!==id);

save();

renderCart();

render();

}


function renderWish(){

const box=document.getElementById('wishItems');

let list=
wishlist
.map(id=>products.find(p=>p.id===id))
.filter(Boolean);

box.innerHTML=list.length?

list.map(p=>`

<div class="row">

<img src="${p.img}">

<div style="flex:1">

<b>${p.name}</b>

<div>
${money(p.price)}
</div>

</div>

<button
onclick="addCart(${p.id})">
Add
</button>

</div>

`).join('')

:

'<div class="empty">Your wishlist is empty.</div>';

}


function filterCategory(cat){

render(
products.filter(
p=>p.category===cat
)
);

scrollToShop();

}


function scrollToShop(){

document.getElementById('shop')
.scrollIntoView({
behavior:'smooth'
});

}


document.getElementById('search')
.addEventListener('input',e=>{

const q=e.target.value.toLowerCase();

render(
products.filter(
p=>(p.name+' '+p.category)
.toLowerCase()
.includes(q)
)
);

});


render();

</script>

</body>
</html>
