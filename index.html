<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deecart — Shop Smart</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f6f6f6;color:#111}
header{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:14px 5%;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:800;letter-spacing:1px}
.search{flex:1;min-width:180px;max-width:520px;padding:12px 16px;border:0;border-radius:24px;outline:0}
nav{display:flex;gap:8px;align-items:center}
nav button{background:transparent;color:#fff;border:0;padding:8px;cursor:pointer;font-size:14px}
.badge{background:#fff;color:#111;border-radius:20px;padding:2px 7px;font-size:11px}

.hero{padding:70px 5%;text-align:center;background:linear-gradient(135deg,#111,#454545);color:#fff}
.hero h1{font-size:42px;margin-bottom:12px}
.hero p{font-size:17px;margin-bottom:22px}
.btn{border:0;background:#fff;color:#111;padding:12px 24px;border-radius:24px;font-weight:700;cursor:pointer}

.section{padding:38px 5%}
.section h2{text-align:center;margin-bottom:22px}

.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.category{background:#fff;border:1px solid #eee;padding:20px;text-align:center;border-radius:12px;cursor:pointer;font-weight:700}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.product{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #ddd}
.product img{width:100%;height:210px;object-fit:cover}
.product-info{padding:14px}
.product h3{margin-bottom:6px}
.muted{color:#666;font-size:13px}
.price{font-size:19px;font-weight:800;margin:10px 0}
.actions{display:flex;gap:8px}
.cart-btn{flex:1;border:0;padding:10px;background:#111;color:#fff;border-radius:8px;cursor:pointer}
.wish{border:1px solid #ddd;background:#fff;border-radius:8px;padding:0 11px;cursor:pointer;font-size:18px}

footer{background:#111;color:#fff;text-align:center;padding:30px;margin-top:35px}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
.panel{background:#fff;max-width:620px;margin:6vh auto;padding:22px;border-radius:16px;max-height:88vh;overflow:auto}
.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px;cursor:pointer}
.input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
.primary{width:100%;padding:12px;background:#111;color:#fff;border:0;border-radius:8px;margin-top:8px;cursor:pointer}
.link{border:0;background:none;color:#555;margin-top:12px;cursor:pointer}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.row img{width:65px;height:65px;object-fit:cover;border-radius:8px}
.qty button{padding:3px 8px;border:1px solid #ccc;background:#fff}
.total{font-size:20px;font-weight:800;text-align:right;margin:18px 0}
.empty{text-align:center;padding:35px;color:#666}

@media(max-width:600px){
.hero h1{font-size:32px}
header{justify-content:center}
nav{width:100%;justify-content:center}
}
</style>
</head>

<body>

<header>
<div class="logo">DEECART</div>

<input id="search" class="search" type="search" placeholder="Search products...">

<nav>
<button onclick="scrollToShop()">Shop</button>
<button onclick="openWishlist()">❤️ <span id="wishCount" class="badge">0</span></button>
<button onclick="openCart()">🛒 <span id="cartCount" class="badge">0</span></button>
<button onclick="openAuth()">👤 Login</button>
</nav>
</header>

<section class="hero">
<h1>Shop Everything. One Cart.</h1>
<p>Discover products you'll love at great prices.</p>
<button class="btn" onclick="scrollToShop()">Shop Now</button>
</section>

<section class="section">
<h2>Categories</h2>

<div class="categories">
<div class="category" onclick="filterCategory('Fashion')">👕 Fashion</div>
<div class="category" onclick="filterCategory('Electronics')">📱 Electronics</div>
<div class="category" onclick="filterCategory('Beauty')">💄 Beauty</div>
<div class="category" onclick="filterCategory('Home')">🏠 Home & Living</div>
<div class="category" onclick="filterCategory('Accessories')">⌚ Accessories</div>
</div>
</section>

<section class="section" id="shop">
<h2>Featured Products</h2>
<div id="products" class="products"></div>
</section>

<footer>
<h2>DEECART</h2>
<p>Shop Smart. Live Better.</p>
<p style="margin-top:10px">© 2026 Deecart</p>
</footer>

<!-- LOGIN -->

<div id="authModal" class="modal" onclick="backdrop(event,'authModal')">
<div class="panel">

<button class="close" onclick="closeModal('authModal')">✕</button>

<h2 id="authTitle">Login</h2>

<input id="email" class="input" type="email" placeholder="Email address">

<input id="password" class="input" type="password" placeholder="Password">

<button class="primary" onclick="authAction()" id="authButton">
Login
</button>

<button class="link" onclick="toggleAuth()" id="toggleButton">
Create a new account
</button>

<p id="authMessage" style="margin-top:12px;text-align:center"></p>

</div>
</div>

<!-- CART -->

<div id="cartModal" class="modal" onclick="backdrop(event,'cartModal')">
<div class="panel">

<button class="close" onclick="closeModal('cartModal')">✕</button>

<h2>Your Cart</h2>

<div id="cartItems"></div>

<div id="cartTotal" class="total"></div>

<button class="primary" onclick="alert('Payment will be connected in the next step.')">
Proceed to Checkout
</button>

</div>
</div>

<!-- WISHLIST -->

<div id="wishModal" class="modal" onclick="backdrop(event,'wishModal')">
<div class="panel">

<button class="close" onclick="closeModal('wishModal')">✕</button>

<h2>Wishlist</h2>

<div id="wishItems"></div>

</div>
</div>

<script>

/* ==============================
   SUPABASE
   ============================== */

const SUPABASE_URL =
"https://uybkhgmrvsqrnzftkghp.supabase.co";

/*
PASTE YOUR SUPABASE PUBLISHABLE KEY BELOW.
DO NOT USE SECRET KEY.
*/

const SUPABASE_KEY =
"PASTE_YOUR_PUBLISHABLE_KEY_HERE";

let supabaseClient=null;

if(
SUPABASE_KEY !== "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
){
supabaseClient=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
}


/* PRODUCTS */

const products=[

{
id:1,
name:"Classic T-Shirt",
category:"Fashion",
price:499,
img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80"
},

{
id:2,
name:"Wireless Headphones",
category:"Electronics",
price:1999,
img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"
},

{
id:3,
name:"Classic Watch",
category:"Accessories",
price:999,
img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"
},

{
id:4,
name:"Running Shoes",
category:"Fashion",
price:1499,
img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"
},

{
id:5,
name:"Skincare Set",
category:"Beauty",
price:799,
img:"https://images.unsplash.com/photo-1556229010-6c3f2c9ca5f8?auto=format&fit=crop&w=600&q=80"
},

{
id:6,
name:"Modern Lamp",
category:"Home",
price:1299,
img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=600&q=80"
}

];


let cart=JSON.parse(
localStorage.getItem("deecart_cart")||"[]"
);

let wishlist=JSON.parse(
localStorage.getItem("deecart_wishlist")||"[]"
);

let loginMode=true;


/* PRODUCT RENDER */

function money(n){
return "₹"+n.toLocaleString("en-IN");
}

function render(list=products){

const box=document.getElementById("products");

box.innerHTML=list.length?

list.map(p=>`

<article class="product">

<img src="${p.img}" alt="${p.name}">

<div class="product-info">

<h3>${p.name}</h3>

<div class="muted">${p.category}</div>

<div class="price">${money(p.price)}</div>

<div class="actions">

<button class="cart-btn"
onclick="addCart(${p.id})">
Add to Cart
</button>

<button class="wish"
onclick="toggleWish(${p.id})">
${wishlist.includes(p.id)?"♥":"♡"}
</button>

</div>

</div>

</article>

`).join("")

:

'<div class="empty">No products found.</div>';

updateCounts();

}


/* CART */

function addCart(id){

let x=cart.find(i=>i.id===id);

x?x.qty++:cart.push({
id:id,
qty:1
});

save();
render();

alert("Added to cart!");

}

function openCart(){

document.getElementById("cartModal")
.style.display="block";

renderCart();

}

function renderCart(){

const box=document.getElementById("cartItems");

if(!cart.length){

box.innerHTML=
'<div class="empty">Your cart is empty.</div>';

document.getElementById("cartTotal")
.textContent="";

return;
}

let total=0;

box.innerHTML=cart.map(i=>{

let p=products.find(x=>x.id===i.id);

total+=p.price*i.qty;

return `

<div class="row">

<img src="${p.img}">

<div style="flex:1">

<b>${p.name}</b>

<div>${money(p.price)}</div>

<div class="qty">

<button onclick="changeQty(${p.id},-1)">−</button>

${i.qty}

<button onclick="changeQty(${p.id},1)">+</button>

</div>

</div>

<button onclick="removeCart(${p.id})">✕</button>

</div>

`;

}).join("");

document.getElementById("cartTotal")
.textContent="Total: "+money(total);

}

function changeQty(id,d){

let x=cart.find(i=>i.id===id);

x.qty+=d;

if(x.qty<=0)
cart=cart.filter(i=>i.id!==id);

save();
renderCart();
render();

}

function removeCart(id){

cart=cart.filter(i=>i.id!==id);

save();
renderCart();
render();

}


/* WISHLIST */

function toggleWish(id){

wishlist.includes(id)
?wishlist=wishlist.filter(x=>x!==id)
:wishlist.push(id);

save();
render();

}

function openWishlist(){

document.getElementById("wishModal")
.style.display="block";

const box=document.getElementById("wishItems");

let list=wishlist
.map(id=>products.find(p=>p.id===id))
.filter(Boolean);

box.innerHTML=list.length?

list.map(p=>`

<div class="row">

<img src="${p.img}">

<div style="flex:1">

<b>${p.name}</b>

<div>${money(p.price)}</div>

</div>

<button onclick="addCart(${p.id})">
Add
</button>

</div>

`).join("")

:

'<div class="empty">Your wishlist is empty.</div>';

}


/* SEARCH */

document.getElementById("search")
.addEventListener("input",e=>{

const q=e.target.value.toLowerCase();

render(
products.filter(p=>
(p.name+" "+p.category)
.toLowerCase()
.includes(q)
)
);

});


function filterCategory(cat){

render(
products.filter(p=>p.category===cat)
);

scrollToShop();

}

function scrollToShop(){

document.getElementById("shop")
.scrollIntoView({
behavior:"smooth"
});

}


/* LOGIN */

function openAuth(){

document.getElementById("authModal")
.style.display="block";

}

function toggleAuth(){

loginMode=!loginMode;

document.getElementById("authTitle").textContent=
loginMode?"Login":"Create Account";

document.getElementById("authButton").textContent=
loginMode?"Login":"Sign Up";

document.getElementById("toggleButton").textContent=
loginMode
?"Create a new account"
:"Already have an account? Login";

document.getElementById("authMessage")
.textContent="";

}

async function authAction(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

const message=
document.getElementById("authMessage");

if(!supabaseClient){

message.textContent=
"Please add your Supabase Publishable Key first.";

return;

}

if(!email || !password){

message.textContent=
"Please enter email and password.";

return;

}

message.textContent="Please wait...";

try{

if(loginMode){

const {error}=await supabaseClient.auth
.signInWithPassword({
email:email,
password:password
});

if(error) throw error;

message.textContent="Login successful!";

}

else{

const SUPABASE_KEY =
"const SUPABASE_URL = "https://uybkhgmrvsqrnzftkghp.supabase.co";

const SUPABASE_KEY = "sb_publishable_lqdJt0fwhtf4VTuH0M22eQ_y6edgxgW";";
.signUp({
email:email,
password:password
});

if(error) throw error;

message.textContent=
"Account created. Check your email.";

}

}

catch(error){

message.textContent=error.message;

}

}


/* SAVE */

function save(){

localStorage.setItem(
"deecart_cart",
JSON.stringify(cart)
);

localStorage.setItem(
"deecart_wishlist",
JSON.stringify(wishlist)
);

updateCounts();

}

function updateCounts(){

document.getElementById("cartCount").textContent=
cart.reduce((s,x)=>s+x.qty,0);

document.getElementById("wishCount").textContent=
wishlist.length;

}


/* MODALS */

function closeModal(id){

document.getElementById(id)
.style.display="none";

}

function backdrop(e,id){

if(e.target.id===id)
closeModal(id);

}


/* START */

render();

</script>

</body>
  </html>
